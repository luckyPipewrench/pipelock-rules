name: Release

# Repository releases use plain v-tags for repository tooling. Bundle CalVer
# remains independent and is read from each published bundle below.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PIPELOCK_VERSION: "3.5.0"
  PIPELOCK_CANDIDATE_REF: "314bbd1f28764f0729482f7e452a77a8e2d01392"

jobs:
  release:
    name: Publish signed bundles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # A release asset labelled "signed" must have had its signature checked
      # against the pinned official key at release time. Asset presence is not
      # verification: a stale compile or a signature over older content would
      # otherwise ship as official and fail the documented install flow.
      - name: Set up Go for the tested Pipelock candidate
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Check out the tested Pipelock candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: luckyPipewrench/pipelock
          ref: ${{ env.PIPELOCK_CANDIDATE_REF }}
          path: .pipelock-candidate
          persist-credentials: false

      - name: Build the tested Pipelock candidate
        run: |
          set -euo pipefail
          test "$(git -C .pipelock-candidate rev-parse HEAD)" = "$PIPELOCK_CANDIDATE_REF"
          make -C .pipelock-candidate VERSION="$PIPELOCK_VERSION" GIT_COMMIT="$PIPELOCK_CANDIDATE_REF" build
          install -m 0755 .pipelock-candidate/pipelock /usr/local/bin/pipelock
          test "$(pipelock --version)" = "pipelock version $PIPELOCK_VERSION"

      - name: Verify published bundles are current and signed
        env:
          EXPECTED_OFFICIAL_PUBKEY_SHA256: ${{ vars.RULES_OFFICIAL_PUBKEY_SHA256 }}
        run: scripts/check-published-signatures.sh

      - name: Prepare release assets and body
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -d '' bundle_dirs < <(find published -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          if (( ${#bundle_dirs[@]} == 0 )); then
            echo 'release: FAIL - no published bundles found' >&2
            exit 1
          fi

          {
            printf '# Pipelock Rules %s\n\n' "${GITHUB_REF_NAME}"
            printf 'This repository release packages these independently versioned bundles:\n\n'
            for bundle_dir in "${bundle_dirs[@]}"; do
              bundle="$(basename "$bundle_dir")"
              bundle_file="$bundle_dir/bundle.yaml"
              signature_file="$bundle_file.sig"
              if [[ ! "$bundle" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
                printf 'release: FAIL - invalid bundle directory name: %s\n' "$bundle" >&2
                exit 1
              fi
              if [[ ! -f "$bundle_file" || ! -f "$signature_file" ]]; then
                printf 'release: FAIL - %s must contain bundle.yaml and bundle.yaml.sig\n' "$bundle_dir" >&2
                exit 1
              fi
              # Collect every matching line and require exactly one non-empty
              # value. Reading into a scalar hid a duplicate declaration whose
              # empty value sorted last, because command substitution strips
              # trailing newlines and the result then looked single-valued.
              versions=()
              mapfile -t versions < <(sed -n 's/^version: "\([^"]*\)"$/\1/p' "$bundle_file")
              if (( ${#versions[@]} != 1 )) || [[ -z "${versions[0]}" ]]; then
                printf 'release: FAIL - %s must contain exactly one quoted version line\n' "$bundle_file" >&2
                exit 1
              fi
              version="${versions[0]}"
              cp "$bundle_file" "release-assets/${bundle}-bundle.yaml"
              cp "$signature_file" "release-assets/${bundle}-bundle.yaml.sig"
              printf -- '- `%s` `%s`\n' "$bundle" "$version"
            done
            printf '\nRepository tags use plain `v*` versions for release packaging and tooling. Each bundle keeps its own CalVer version.\n'
          } > release-body.md

          (
            cd release-assets
            LC_ALL=C sha256sum ./*-bundle.yaml ./*-bundle.yaml.sig > SHA256SUMS
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: Pipelock Rules ${{ github.ref_name }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*

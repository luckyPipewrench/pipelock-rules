name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  security-scan:
    name: Pipelock scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Pipelock Scan
        uses: luckyPipewrench/pipelock@e8a396d244af27b1367e116fa22fc61246884ab3 # v3.1.0
        with:
          scan-diff: 'true'
          fail-on-findings: 'true'
          test-vectors: 'false'
          exclude-paths: |
            fixtures/
            scripts/

  validate:
    name: Validate bundle (${{ matrix.bundle }})
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bundle: [pipelock-community, healthcare-phi-pii]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pipelock
        run: |
          set -euo pipefail
          PIPELOCK_VERSION=3.1.0
          PIPELOCK_SHA256=e474b26ae5b12af75106e079c0a3d505c40022f85bef18737011e3c12c9969be
          RELEASE_URL="https://github.com/luckyPipewrench/pipelock/releases/download/v${PIPELOCK_VERSION}"
          ARCHIVE="pipelock_${PIPELOCK_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/${ARCHIVE}" "${RELEASE_URL}/${ARCHIVE}"
          printf '%s  %s\n' "$PIPELOCK_SHA256" "/tmp/${ARCHIVE}" | sha256sum -c -
          tar xzf "/tmp/${ARCHIVE}" -C /usr/local/bin pipelock
          rm -f "/tmp/${ARCHIVE}"
          pipelock --version

      - name: Compile and validate bundle
        run: BUNDLE_NAME=${{ matrix.bundle }} make validate

  validate-required:
    name: Validate bundle
    needs: [validate, published-signatures]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.published-signatures.result }}" = "success"

  published-signatures:
    name: Verify published signatures
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_OFFICIAL_PUBKEY_SHA256: ${{ vars.RULES_OFFICIAL_PUBKEY_SHA256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pipelock
        run: |
          set -euo pipefail
          PIPELOCK_VERSION=3.1.0
          PIPELOCK_SHA256=e474b26ae5b12af75106e079c0a3d505c40022f85bef18737011e3c12c9969be
          RELEASE_URL="https://github.com/luckyPipewrench/pipelock/releases/download/v${PIPELOCK_VERSION}"
          ARCHIVE="pipelock_${PIPELOCK_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/${ARCHIVE}" "${RELEASE_URL}/${ARCHIVE}"
          printf '%s  %s\n' "$PIPELOCK_SHA256" "/tmp/${ARCHIVE}" | sha256sum -c -
          tar xzf "/tmp/${ARCHIVE}" -C /usr/local/bin pipelock
          rm -f "/tmp/${ARCHIVE}"
          pipelock --version

      - name: Verify committed bundles are current and signed
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          scripts/check-version-bumps.sh "$BASE_REF"
          scripts/check-published-signatures.sh

  test-fixtures:
    name: Test fixtures (${{ matrix.bundle }})
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bundle: [pipelock-community, healthcare-phi-pii]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run fixture tests
        run: BUNDLE_NAME=${{ matrix.bundle }} make test-fixtures

  test-fixtures-required:
    name: Test fixtures
    needs: [test-fixtures]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: test "${{ needs.test-fixtures.result }}" = "success"

  yaml-lint:
    name: Lint YAML (${{ matrix.bundle }})
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bundle: [pipelock-community, healthcare-phi-pii]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install yamllint
        run: pip install --require-hashes -r .github/requirements-yamllint.txt

      - name: Lint compiled bundle
        run: |
          BUNDLE_NAME=${{ matrix.bundle }} make compile
          yamllint -d '{extends: default, rules: {line-length: {max: 300}, document-start: disable, truthy: disable, empty-lines: {max: 1}}}' "published/${{ matrix.bundle }}/bundle.yaml"

  yaml-lint-required:
    name: Lint YAML
    needs: [yaml-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: test "${{ needs.yaml-lint.result }}" = "success"

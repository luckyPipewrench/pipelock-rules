name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  security-scan:
    name: Pipelock scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Pipelock Scan
        uses: luckyPipewrench/pipelock@7a3b7de4a5552b4e756eb930256468b7cbd616b1 # v2
        with:
          scan-diff: 'true'
          fail-on-findings: 'true'
          test-vectors: 'false'
          exclude-paths: |
            fixtures/
            scripts/

  validate:
    name: Validate bundle (${{ matrix.bundle }})
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bundle: [pipelock-community, healthcare-phi-pii]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pipelock
        run: |
          set -euo pipefail
          PIPELOCK_COMMIT=cef4f47eb99ffe00e20fa7d1423bff1a44742dbe
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          go install "github.com/luckyPipewrench/pipelock/cmd/pipelock@${PIPELOCK_COMMIT}"
          "$HOME/go/bin/pipelock" --version

      - name: Compile and validate bundle
        run: BUNDLE_NAME=${{ matrix.bundle }} make validate

  validate-required:
    name: Validate bundle
    needs: [validate, published-signatures]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.published-signatures.result }}" = "success"

  published-signatures:
    name: Verify published signatures
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_OFFICIAL_PUBKEY_SHA256: ${{ vars.RULES_OFFICIAL_PUBKEY_SHA256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pipelock
        run: |
          set -euo pipefail
          PIPELOCK_COMMIT=cef4f47eb99ffe00e20fa7d1423bff1a44742dbe
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          go install "github.com/luckyPipewrench/pipelock/cmd/pipelock@${PIPELOCK_COMMIT}"
          "$HOME/go/bin/pipelock" --version

      - name: Verify committed bundles are current and signed
        run: scripts/check-published-signatures.sh

  test-fixtures:
    name: Test fixtures (${{ matrix.bundle }})
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bundle: [pipelock-community, healthcare-phi-pii]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run fixture tests
        run: BUNDLE_NAME=${{ matrix.bundle }} make test-fixtures

  test-fixtures-required:
    name: Test fixtures
    needs: [test-fixtures]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: test "${{ needs.test-fixtures.result }}" = "success"

  yaml-lint:
    name: Lint YAML (${{ matrix.bundle }})
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bundle: [pipelock-community, healthcare-phi-pii]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pip install --require-hashes -r .github/requirements-yamllint.txt

      - name: Lint compiled bundle
        run: |
          BUNDLE_NAME=${{ matrix.bundle }} make compile
          yamllint -d '{extends: default, rules: {line-length: {max: 300}, document-start: disable, truthy: disable, empty-lines: {max: 1}}}' "published/${{ matrix.bundle }}/bundle.yaml"

  yaml-lint-required:
    name: Lint YAML
    needs: [yaml-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: test "${{ needs.yaml-lint.result }}" = "success"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PIPELOCK_VERSION: "3.5.0"
  PIPELOCK_CANDIDATE_REF: "ca1c0b1cfe0ddfadd5ca43cb30dca1b9151b3919"

jobs:
  validate:
    name: Preflight bundles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go for the tested Pipelock candidate
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Check out the tested Pipelock candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: luckyPipewrench/pipelock
          ref: ${{ env.PIPELOCK_CANDIDATE_REF }}
          path: .pipelock-candidate
          persist-credentials: false

      - name: Build the tested Pipelock candidate
        run: |
          set -euo pipefail
          test "$(git -C .pipelock-candidate rev-parse HEAD)" = "$PIPELOCK_CANDIDATE_REF"
          make -C .pipelock-candidate VERSION="$PIPELOCK_VERSION" GIT_COMMIT="$PIPELOCK_CANDIDATE_REF" build
          install -m 0755 .pipelock-candidate/pipelock /usr/local/bin/pipelock
          test "$(pipelock --version)" = "pipelock version $PIPELOCK_VERSION"

      - name: Run local preflight gate
        run: make preflight

  compatibility-floor:
    name: Compatibility floor (${{ matrix.bundle }}, v${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: pipelock-community
            version: 1.4.0
            sha256: 6197c4661d96854b1b5f36fe6ac7113522eeddccc8314bcfb1d5750ce6ce6610
          - bundle: healthcare-phi-pii
            version: 1.5.0
            sha256: ed6aeaf97a8928272254508d516e34e74fce4dfcfdf4a6ea1efac21b188aadc2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install declared minimum Pipelock
        env:
          PIPELOCK_VERSION: ${{ matrix.version }}
          PIPELOCK_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="pipelock_${PIPELOCK_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/${archive}" "https://github.com/luckyPipewrench/pipelock/releases/download/v${PIPELOCK_VERSION}/${archive}"
          printf '%s  %s\n' "$PIPELOCK_SHA256" "/tmp/${archive}" | sha256sum -c -
          tar xzf "/tmp/${archive}" -C /usr/local/bin pipelock
          pipelock --version

      - name: Validate bundle at its declared floor
        run: make BUNDLE_NAME=${{ matrix.bundle }} validate

  validate-required:
    name: Validate bundle
    needs: [validate, compatibility-floor, published-signatures]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.compatibility-floor.result }}" = "success"
          test "${{ needs.published-signatures.result }}" = "success"

  # `Test fixtures` is a required status check. The fixture run now happens
  # inside the preflight matrix, so this reports that name from the matrix
  # result. Without it the requirement is unsatisfiable and every pull request
  # stays blocked while appearing merely pending.
  test-fixtures-required:
    name: Test fixtures
    needs: [validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: test "${{ needs.validate.result }}" = "success"

  published-signatures:
    name: Verify published signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_OFFICIAL_PUBKEY_SHA256: ${{ vars.RULES_OFFICIAL_PUBKEY_SHA256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go for the tested Pipelock candidate
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Check out the tested Pipelock candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: luckyPipewrench/pipelock
          ref: ${{ env.PIPELOCK_CANDIDATE_REF }}
          path: .pipelock-candidate
          persist-credentials: false

      - name: Build the tested Pipelock candidate
        run: |
          set -euo pipefail
          test "$(git -C .pipelock-candidate rev-parse HEAD)" = "$PIPELOCK_CANDIDATE_REF"
          make -C .pipelock-candidate VERSION="$PIPELOCK_VERSION" GIT_COMMIT="$PIPELOCK_CANDIDATE_REF" build
          install -m 0755 .pipelock-candidate/pipelock /usr/local/bin/pipelock
          test "$(pipelock --version)" = "pipelock version $PIPELOCK_VERSION"

      - name: Verify committed bundles are current and signed
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          scripts/test-version-bumps.sh
          scripts/check-version-bumps.sh "$BASE_REF"
          scripts/check-published-signatures.sh

  yaml-lint:
    name: Lint YAML (${{ matrix.bundle }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bundle: [pipelock-community, healthcare-phi-pii]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install yamllint
        run: pip install --require-hashes -r .github/requirements-yamllint.txt

      - name: Lint compiled bundle
        run: |
          BUNDLE_NAME=${{ matrix.bundle }} make compile
          yamllint -d '{extends: default, rules: {line-length: {max: 400}, document-start: disable, truthy: disable, empty-lines: {max: 1}}}' "published/${{ matrix.bundle }}/bundle.yaml"

  yaml-lint-required:
    name: Lint YAML
    needs: [yaml-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm matrix passed
        run: test "${{ needs.yaml-lint.result }}" = "success"

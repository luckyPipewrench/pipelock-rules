version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
    groups:
      ci-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
    groups:
      python-deps:
        patterns:
          - "*"

  - id: injection-system-tag-override
    type: injection
    status: stable
    name: "System Tag Override"
    description: "Detects fake system/override XML tags used to impersonate trusted message boundaries"
    severity: high
    confidence: high
    references:
      - "https://arxiv.org/abs/2404.13208"
    tags:
      - "owasp-llm:LLM01"
    pattern:
      # "override" is the one alternative that is also an ordinary XML element
      # name (Maven/Spring/Android config). Allowing it attributes makes
      # <override enabled="true" scope="global"> match benign config, so it
      # stays bare-tag only; every other alternative is injection-specific
      # enough to carry attributes.
      regex: '<(?:(?:system_instructions?|true_instructions?|real_instructions?|hidden_prompt|system_prompt|secret_instructions?|admin_message|internal_prompt)(?:\s+[^<>]{1,200})?|override)\s*>'
